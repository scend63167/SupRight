  <text x="176" y="337" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#374151">◌  概览</text>
  <text x="176" y="381" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#374151">⌁  权限与访问</text>
  <text x="176" y="425" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#374151">⌘  诊断</text>
  <line x1="156" y1="787" x2="362" y2="787" stroke="#e5e7eb"/>
  <circle cx="176" cy="824" r="6" fill="#22a06b"/><text x="190" y="829" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#374151">Finder 扩展已启用</text>
  <text x="440" y="200" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="29" font-weight="700" fill="#111827">菜单功能</text>
  <text x="440" y="232" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#6b7280">控制显示在 Finder 右键菜单中的操作。修改会在下一次右键时生效。</text>
  <rect x="1110" y="184" width="150" height="42" rx="10" fill="#eaf7ef"/><circle cx="1133" cy="205" r="6" fill="#22a06b"/><text x="1190" y="211" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#16784a" text-anchor="middle">已启用 10 / 10</text>
  <rect x="440" y="273" width="820" height="305" rx="13" fill="#ffffff" stroke="#e1e5ea"/>
