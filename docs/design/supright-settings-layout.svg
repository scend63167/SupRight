  <rect x="130" y="80" width="1180" height="52" rx="18" fill="#fafbfc"/>
  <circle cx="160" cy="106" r="7" fill="#ff5f57"/><circle cx="184" cy="106" r="7" fill="#febc2e"/><circle cx="208" cy="106" r="7" fill="#28c840"/>
  <text x="720" y="112" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">SupRight</text>
  <rect x="130" y="132" width="258" height="738" fill="#f8f9fb"/>
  <line x1="388" y1="132" x2="388" y2="870" stroke="#e4e7ec"/>
