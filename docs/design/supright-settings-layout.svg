  <text x="198" y="179" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#111827">SupRight</text>
  <text x="198" y="201" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#6b7280">Finder 右键增强</text>
