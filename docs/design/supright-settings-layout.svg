  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#27303f"><text x="496" y="694">复制文件名</text><text x="746" y="694">复制完整路径</text><text x="1000" y="694">在终端中打开</text></g>
  <g fill="#0f6cbd"><rect x="647" y="676" width="38" height="22" rx="11"/><circle cx="674" cy="687" r="8" fill="white"/><rect x="909" y="676" width="38" height="22" rx="11"/><circle cx="936" cy="687" r="8" fill="white"/><rect x="1150" y="676" width="38" height="22" rx="11"/><circle cx="1177" cy="687" r="8" fill="white"/></g>
  <rect x="440" y="780" width="820" height="64" rx="10" fill="#fff8e6" stroke="#f3dd9a"/>
  <circle cx="472" cy="812" r="11" fill="#d28a00"/><text x="472" y="817" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="white" text-anchor="middle">!</text>
  <text x="496" y="806" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#6d4c00">请在系统设置中确认完全磁盘访问</text><text x="496" y="827" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#7a5b14">受保护目录可能无法创建文件。</text>
  <rect x="1101" y="796" width="130" height="32" rx="8" fill="#ffffff" stroke="#d5aa3c"/><text x="1166" y="817" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#8a6100" text-anchor="middle">前往系统设置</text>
